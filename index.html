// 🟢 Audit DRG/REV/PROC/DIAG
function AuditDRGREVPROCDIAG() {
    ResetAuditColors(); window.ppoPersistedColors = {};
    
    // 1. IRATE ke saare cells ka rang saaf (Reset) karein
    document.querySelectorAll("[id^='irate_row_']").forEach(row => row.querySelectorAll("td").forEach(td => { td.style.backgroundColor = ""; td.style.color = ""; }));
    console.log("DRG REV PROC DIAG AUDIT STARTED (GLOBAL EQUALITY ENGINE)");

    // VBA FILTER-SAFE HACK: Filter values yaad rakho aur temporary kholo
    const dropdowns = document.querySelectorAll(".ppo-filter-dropdown"), ppoRows = document.querySelectorAll("tr[id^='ppo_row_']");
    let savedFilters = {};
    dropdowns.forEach(sel => { if (sel.value) savedFilters[sel.getAttribute("data-col")] = sel.value; sel.value = ""; });
    console.log("DOM PPO Rows:", ppoRows.length);
    console.log("Dataset PPO Rows:", userPPOoneData.filter(r => String(r.detailId).trim() === cmbDetailID.value).length);
    ppoRows.forEach(row => row.style.display = "");

    // Column mapping index (PPO Index vs IRATE Prefix)
    const mappings = [{ ppoIdx: 1, iratePre: "irate_drgS_" }, { ppoIdx: 2, iratePre: "irate_drgE_" }, { ppoIdx: 3, iratePre: "irate_revS_" }, { ppoIdx: 4, iratePre: "irate_revE_" }, { ppoIdx: 5, iratePre: "irate_procS_" }, { ppoIdx: 6, iratePre: "irate_procE_" }, { ppoIdx: 7, iratePre: "irate_diagS_" }, { ppoIdx: 8, iratePre: "irate_diagE_" }];

    // EXACT VBA CleanLeadingZeros TWIN FUNCTION
const parseValue = (cell) => {
    if (!cell) return "";
    let raw = cell.querySelector("span") ? cell.querySelector("span").innerText : cell.innerText;
    if (raw.includes("▼")) raw = raw.split("▼")[0];
    let cleaned = String(raw || "").trim().toUpperCase();
    if (cleaned === "" || cleaned === "MISC") return "";
    if (cleaned === "ALL" || cleaned === "N") return "*";
    return /^\d+$/.test(cleaned) ? String(parseInt(cleaned, 10)) : cleaned;
};

    const checkMatch = (v1, v2) => {
        if (v1 === "*" || v2 === "*") return true; if (v1 === v2) return true;
        let items1 = v1.split(/[\s,|+\n]+/).map(i => i.trim()).filter(Boolean);
        let items2 = v2.split(/[\s,|+\n]+/).map(i => i.trim()).filter(Boolean);
        return items1.some(item => items2.includes(item)) || items2.some(item => items1.includes(item));
    };

    // 2. Poori range ko default RED rang do (VBA Step 1)
    ppoRows.forEach((row, rIdx) => {
        mappings.forEach(({ ppoIdx }) => {
            const cell = row.children[ppoIdx];
            if (cell && parseValue(cell) !== "") {
                cell.style.backgroundColor = "#f8d7da"; cell.style.color = "#721c24";
                window.ppoPersistedColors[`row_${rIdx}_col_${ppoIdx}`] = { bg: "#f8d7da", fg: "#721c24" };
            }
        });
});

// 3. GLOBAL MATCHING ENGINE: IRATE ko PPO (Hidden + Visible) se tally karo
for (let r = 0; r < userIrateData.length; r++) {
        mappings.forEach(({ ppoIdx, iratePre }) => {
            const irateCell = document.getElementById(`${iratePre}${r}`); if (!irateCell) return;
            let irateVal = parseValue(irateCell); if (irateVal === "") return;
            let matchFound = false;

            ppoRows.forEach((ppoRow, ppoRowIdx) => {
                const ppoCell = ppoRow.children[ppoIdx]; if (!ppoCell) return;
                let ppoVal = parseValue(ppoCell);
                console.log("PPO:", ppoVal, "IRATE:", irateVal);
                if (ppoVal !== "" && checkMatch(ppoVal, irateVal)) {
                    matchFound = true;
                    ppoCell.style.backgroundColor = "#d4edda"; ppoCell.style.color = "#155724";
                    window.ppoPersistedColors[`row_${ppoRowIdx}_col_${ppoIdx}`] = { bg: "#d4edda", fg: "#155724" };
                }
            });

            window.iratePersistedColors = window.iratePersistedColors || {};
            if (matchFound) {
                irateCell.style.backgroundColor = "#d4edda"; irateCell.style.color = "#155724";
                window.iratePersistedColors[`${iratePre}${r}`] = { bg: "#d4edda", fg: "#155724" };
            } else {
                irateCell.style.backgroundColor = "#f8d7da"; irateCell.style.color = "#721c24";
                window.iratePersistedColors[`${iratePre}${r}`] = { bg: "#f8d7da", fg: "#721c24" };
            }
});
}

// VBA RESTORE FILTER HACK: User ka filter wapas lagao
for (let cIdx in savedFilters) {
        const selectBox = document.querySelector(`.ppo-filter-dropdown[data-col='${cIdx}']`);
        if (selectBox) selectBox.value = savedFilters[cIdx];
    }

    ppoRows.forEach(row => {
        let showRow = true;
        for (let cIdx in savedFilters) { if ((row.children[cIdx] ? row.children[cIdx].innerText.trim() : "") !== savedFilters[cIdx]) { showRow = false; break; } }
        row.style.display = showRow ? "" : "none";
    });
    if (typeof updateHint === "function") {
        updateHint("DRG / REV / PROC / DIAG Audit Completed\n" +
                   "• Irate DRG (FRM-TO) will match to ppoONE DRG Start - DRG End\n" +
                   "• Irate REV/PROC CD (FRM-TO) will match to ppoONE Rev Start - Rev End\n" +
                   "• Irate ICD PROC CD (FRM-TO) will match to ppoONE Proc Start - Proc End\n" +
                   "• Irate PRIME DX CD (FROM-TO) will match to ppoONE Diag Start - Diag End");
    }
    scrollToSection(document.querySelector(".banner-row"), 50);
}

function scrollToSection(element, offset = 50) {
    const container = document.querySelector(".dynamic-scroll-zone");
    if (element && container) container.scrollTo({ top: element.offsetTop - offset, behavior: "smooth" });
}

// COLOUR RESTORE PARTS FOR ALL 
// =========================================================================
function restoreIrateColors() {

    if (!window.iratePersistedColors) return;

    Object.keys(window.iratePersistedColors)
        .forEach(id => {

            const cell =
                document.getElementById(id);

            if (!cell) return;

            cell.style.backgroundColor =
                window.iratePersistedColors[id].bg;

            cell.style.color =
                window.iratePersistedColors[id].fg;
        });
}

// PART 16: STANDALONE ENGINE MODULES - AUDIT COMP IND P & D UTILITIES
// =========================================================================       
function AuditCompIndP() {
    if (userPPOoneData.length === 0 || userIrateData.length === 0) return;

    // =========================================
    // FULL RESET
    // =========================================
    window.iratePersistedColors = {}; window.ppoPersistedColors = {};
    document.querySelectorAll("tr[id^='ppo_row_'] td, tr[id^='irate_row_'] td").forEach(td => { td.style.backgroundColor = ""; td.style.color = ""; });

    StableSummary(cmbDetailID.value);

    setTimeout(() => {
        let filteredPPO = getFilteredPPOData(), ppoMatched = new Array(filteredPPO.length).fill(false);
        const dictRate = {};

        // =========================================
        // PPO RATE DICTIONARY
        // =========================================
        filteredPPO.forEach((ppoRow, pIdx) => {
            const key = String(Number(ppoRow.rate || 0));
            if (!dictRate[key]) dictRate[key] = [];
            dictRate[key].push(pIdx);
        });

        // =========================================
        // IRATE PROCESSING
        // =========================================
        userIrateData.forEach((r, idx) => {
            let compInd = String(r.comp || "").trim().toUpperCase(), irateRowEl = document.getElementById(`irate_row_${idx}`);
            if (compInd !== "P") { if (irateRowEl) irateRowEl.style.display = "none"; return; }
            if (irateRowEl) irateRowEl.style.display = "";

            const key = String(Number(r.p1 || 0));
            let irateCellEl = document.getElementById(`irate_p1_${idx}`);

            if (dictRate[key]) {
                // IRATE GREEN
                if (irateCellEl) { irateCellEl.style.backgroundColor = "#d4edda"; irateCellEl.style.color = "#155724"; }
                // PPO GREEN
                dictRate[key].forEach(pIdx => {
                    ppoMatched[pIdx] = true;
                    let ppoCellEl = document.getElementById(`ppo_rate_${pIdx}`);
                    if (ppoCellEl) { ppoCellEl.style.backgroundColor = "#d4edda"; ppoCellEl.style.color = "#155724"; }
                });
            } else {
                // IRATE RED
                if (irateCellEl) { irateCellEl.style.backgroundColor = "#f8d7da"; irateCellEl.style.color = "#721c24"; }
            }
});

// =========================================
// UNMATCHED PPO = RED
// =========================================
filteredPPO.forEach((r, pIdx) => {
            let ppoCellEl = document.getElementById(`ppo_rate_${pIdx}`);
            if (ppoCellEl && !ppoMatched[pIdx]) { ppoCellEl.style.backgroundColor = "#f8d7da"; ppoCellEl.style.color = "#721c24"; }
        });

        updateHint("If Irate COMP IND is P, then Irate PYMT1 will match to ppoONE Rate");
        setTimeout(() => scrollToSection(document.querySelector(".banner-row"), 50), 300);
    }, 50);
}

// PART 16 D: STANDALONE ENGINE MODULES - AUDIT COMP IND L & LB UTILITIES
// =========================================================================
function AuditCompIndLB() {
    if (userPPOoneData.length === 0 || userIrateData.length === 0) return;

    // FULL RESET
    window.iratePersistedColors = {};
    window.ppoPersistedColors = {};

    document.querySelectorAll("tr[id^='ppo_row_'] td").forEach(td => { td.style.backgroundColor = ""; td.style.color = ""; });
    document.querySelectorAll("tr[id^='irate_row_'] td").forEach(td => { td.style.backgroundColor = ""; td.style.color = ""; });

    StableSummary(cmbDetailID.value);

    setTimeout(() => {
        const filteredPPO = getFilteredPPOData();
        let ppoMatched = new Array(filteredPPO.length).fill(false);

        // SHOW ONLY LB ROWS
        userIrateData.forEach((r, idx) => {
            const row = document.getElementById(`irate_row_${idx}`);
            if (!row) return;
            row.style.display = String(r.comp || "").trim().toUpperCase() === "LB" ? "" : "none";
        });
 // ==========================
  // CORE AUDIT// IRATE PROCESSING LOOP
// ==========================
userIrateData.forEach((r, idx) => {
            const comp = String(r.comp || "").trim().toUpperCase();
            if (comp !== "LB") return;

            let caseRateFound = false;
            let casePerDiemFound = false;
            const pymt1 = Number(r.p1 || 0);
            const pymt2 = Number(r.p2 || 0);

            const irateP1 = document.getElementById(`irate_p1_${idx}`);
            const irateP2 = document.getElementById(`irate_p2_${idx}`);

            filteredPPO.forEach((ppoRow, pIdx) => {
                const cls = String(ppoRow.cls || "").trim().toUpperCase();
                const rate = Number(ppoRow.rate || 0);

                console.log("CLASS =", cls, "RATE =", rate, "PYMT1 =", pymt1, "PYMT2 =", pymt2);

                const ppoRateCell = document.getElementById(`ppo_rate_${pIdx}`);
                const ppoClassCell = document.getElementById(`ppo_class_${pIdx}`);
                 // ====================
                // CASE RATE → PYMT1
                // ====================
                if (cls === "CASE RATE" && rate === pymt1) {
                    caseRateFound = true;
                    if (irateP1) { irateP1.style.backgroundColor = "#d4edda"; irateP1.style.color = "#155724"; }
                    if (ppoRateCell) { ppoRateCell.style.backgroundColor = "#d4edda"; ppoRateCell.style.color = "#155724"; }
                    if (ppoClassCell) { ppoClassCell.style.backgroundColor = "#d4edda"; ppoClassCell.style.color = "#155724"; }
                    ppoMatched[pIdx] = true;
                }

                // CASEPRDIEM → PYMT2
                if (cls === "CASEPRDIEM" && rate === pymt2) {
                    casePerDiemFound = true;
                    if (irateP2) { irateP2.style.backgroundColor = "#d4edda"; irateP2.style.color = "#155724"; }
                    if (ppoRateCell) { ppoRateCell.style.backgroundColor = "#d4edda"; ppoRateCell.style.color = "#155724"; }
                    if (ppoClassCell) { ppoClassCell.style.backgroundColor = "#d4edda"; ppoClassCell.style.color = "#155724"; }
                    ppoMatched[pIdx] = true;
                }
            });

            // PYMT1 RED
            if (!caseRateFound && irateP1) { irateP1.style.backgroundColor = "#f8d7da"; irateP1.style.color = "#721c24"; }

            // PYMT2 RED
            if (!casePerDiemFound && irateP2) { irateP2.style.backgroundColor = "#f8d7da"; irateP2.style.color = "#721c24"; }
        });
        // PPO MATCH / UNMATCH
        filteredPPO.forEach((r, pIdx) => {
            const cls = String(r.cls || "").trim().toUpperCase();
            if (cls !== "CASE RATE" && cls !== "CASEPRDIEM") return;

            const rateCell = document.getElementById(`ppo_rate_${pIdx}`);
            const classCell = document.getElementById(`ppo_class_${pIdx}`);
            const statusCell = document.getElementById(`ppo_status_${pIdx}`);

            if (ppoMatched[pIdx]) {
                if (statusCell) { statusCell.textContent = "MATCH"; statusCell.style.backgroundColor = "#d4edda"; statusCell.style.color = "#155724"; }
                if (rateCell) { rateCell.style.backgroundColor = "#d4edda"; rateCell.style.color = "#155724"; }
                if (classCell) { classCell.style.backgroundColor = "#d4edda"; classCell.style.color = "#155724"; }
            } else {

            let matched = false;

            filteredPPO.forEach((ppo, pIdx) => {

        });

function AuditMP2MP3PROCHCPC() {

    setTimeout(() => {
        const green = "#d4edda", red = "#f8d7da", greenTxt = "#155724", redTxt = "#721c24";
        const ppoMP2Matched = {}, ppoMP3Matched = {}, ppoProcStartMatched = {}, ppoProcEndMatched = {};
        const filteredPPO = getFilteredPPOData();

        const normalizeNumber = v => parseFloat(String(v || "").replace("%", "").trim());
        const isEqualNumber = (a, b) => Math.abs(normalizeNumber(a) - normalizeNumber(b)) < 0.0001;
        const normalizeText = v => String(v || "").trim().toUpperCase();

        // ===================== MP2 / MP3 =====================
        userTTableData.forEach((tRow, tIdx) => {
            if (
    String(tRow.raw?.[17] || "").trim() === "" &&
    String(tRow.raw?.[18] || "").trim() === ""
){
    return;
}
            const mp2 = normalizeNumber(tRow.raw?.[17]);
            const mp3 = normalizeNumber(tRow.raw?.[18]);

            // सिर्फ तभी ऑडिट करें जब वैल्यूज़ NaN (ब्लैंक/invalid) न हों
            if (!isNaN(mp2) && tRow.raw?.[17] !== "") {
                filteredPPO.forEach((ppo, pIdx) => {
                    const occur2 = normalizeNumber(ppo.secondOccurRate);
                    if (isEqualNumber(mp2, occur2)) { mp2Found = true; ppoMP2Matched[pIdx] = true; }
                });
            }

            if (!isNaN(mp3) && tRow.raw?.[18] !== "") {
                filteredPPO.forEach((ppo, pIdx) => {
                    const addlOccur = normalizeNumber(ppo.addlOccurRate);

            const cellD = document.getElementById(`ttable_mp2_${tIdx}`);
            const cellE = document.getElementById(`ttable_mp3_${tIdx}`);

            if (cellD) { cellD.style.backgroundColor = mp2Found ? green : red; cellD.style.color = mp2Found ? greenTxt : redTxt; }
            if (cellE) { cellE.style.backgroundColor = mp3Found ? green : red; cellE.style.color = mp3Found ? greenTxt : redTxt; }
        });

        // ===================== PROC / HCPC =====================
        userTTableData.forEach((tRow, tIdx) => {
            if (
    String(tRow.raw?.[23] || "").trim() === "" &&
    String(tRow.raw?.[24] || "").trim() === ""
){
    return;
}
            const procS = normalizeText(tRow.raw?.[23]);
            const procE = normalizeText(tRow.raw?.[24]);
            let procSFound = false, procEFound = false;

            // सिर्फ तभी ढूंढें जब वैल्यू खाली ("") न हो
            if (procS !== "") {
                filteredPPO.forEach((ppo, pIdx) => {
                    const hcpcS = normalizeText(ppo.hcpcStart);
                    if (procS === hcpcS) { procSFound = true; ppoProcStartMatched[pIdx] = true; }
                });
            }

            if (procE !== "") {
                filteredPPO.forEach((ppo, pIdx) => {
                    const hcpcE = normalizeText(ppo.hcpcEnd);
                    if (procE === hcpcE) { procEFound = true; ppoProcEndMatched[pIdx] = true; }
                });
            }

            const cellF = document.getElementById(`ttable_procS_${tIdx}`);
            const cellG = document.getElementById(`ttable_procE_${tIdx}`);

            if (cellF) { cellF.style.backgroundColor = procSFound ? green : red; cellF.style.color = procSFound ? greenTxt : redTxt; }
            if (cellG) { cellG.style.backgroundColor = procEFound ? green : red; cellG.style.color = procEFound ? greenTxt : redTxt; }
        });
// =====================
// PPO SIDE COLORING
// =====================
filteredPPO.forEach((ppo, idx) => {
    const occur2 = document.getElementById(`ppo_occur2_${idx}`);
    const addlOccur = document.getElementById(`ppo_addlOccur_${idx}`);
    const procS = document.getElementById(`ppo_procS_${idx}`);
    const procE = document.getElementById(`ppo_procE_${idx}`);

    // MP2
    if (occur2) {
        const isBlank = String(ppo.secondOccurRate || "").trim() === "";
        occur2.style.backgroundColor = isBlank ? "" : (ppoMP2Matched[idx] ? green : red);
        occur2.style.color = isBlank ? "" : (ppoMP2Matched[idx] ? greenTxt : redTxt);
    }

    // MP3
    if (addlOccur) {
        const isBlank = String(ppo.addlOccurRate || "").trim() === "";
        addlOccur.style.backgroundColor = isBlank ? "" : (ppoMP3Matched[idx] ? green : red);
        addlOccur.style.color = isBlank ? "" : (ppoMP3Matched[idx] ? greenTxt : redTxt);
    }

    // PROC START
    if (procS) {
        const isBlank = String(ppo.hcpcStart || "").trim() === "";
        procS.style.backgroundColor = isBlank ? "" : (ppoProcStartMatched[idx] ? green : red);
        procS.style.color = isBlank ? "" : (ppoProcStartMatched[idx] ? greenTxt : redTxt);
    }

    // PROC END
    if (procE) {
        const isBlank = String(ppo.hcpcEnd || "").trim() === "";
        procE.style.backgroundColor = isBlank ? "" : (ppoProcEndMatched[idx] ? green : red);
        procE.style.color = isBlank ? "" : (ppoProcEndMatched[idx] ? greenTxt : redTxt);
    }
});

        updateHint("MP2 ↔ 2ND OCCUR | MP3 ↔ ADDL OCCUR | PROC FRM ↔ HCPC START | PROC TO ↔ HCPC END");
        scrollToSection(document.querySelector(".banner-row"), 50);

}

function initPPOFilters() {
    const dropdowns = document.querySelectorAll(".ppo-filter-dropdown"), rows = document.querySelectorAll(".ppo-data-row");
    if (rows.length === 0) return;
    dropdowns.forEach(selectBox => {
        const colIdx = parseInt(selectBox.getAttribute("data-col"));
        selectBox.innerHTML = '<option value="">▼</option>';
        let uniqueVals = new Set();
        rows.forEach(row => { const cellText = row.children[colIdx] ? row.children[colIdx].innerText.trim() : ""; if (cellText) uniqueVals.add(cellText); });
        Array.from(uniqueVals).sort().forEach(val => {
            const opt = document.createElement("option"); opt.value = val; opt.textContent = val; selectBox.appendChild(opt);

// 🟢 Restore
function restorePersistedColors() {

    if (!window.ppoPersistedColors) return;

    const prefixes = [
        "ppo_drgS_",
        "ppo_drgE_",
        "ppo_revS_",
        "ppo_revE_",
        "ppo_procS_",
        "ppo_procE_",
        "ppo_diagS_",
        "ppo_diagE_"
    ];

    Object.keys(window.ppoPersistedColors)
    .forEach(key => {

        const m =
        key.match(/row_(\d+)_col_(\d+)/);

        if (!m) return;

        const rowIdx = m[1];
        const ppoIdx = parseInt(m[2]);

        const prefix =
        prefixes[ppoIdx - 1];

        const cell =
        document.getElementById(
            `${prefix}${rowIdx}`
        );

        if (!cell) return;

        cell.style.backgroundColor =
        window.ppoPersistedColors[key].bg;

        cell.style.color =
        window.ppoPersistedColors[key].fg;

    });
}
